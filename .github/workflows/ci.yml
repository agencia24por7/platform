name: ci

on:
  push:
    branches: [dev]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tria
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Auditoria de dependências
        run: npm audit --audit-level=high

      - run: npm run typecheck

      - name: Testes de domínio
        run: npm run test:unit

      - run: npm run build
        env:
          NODE_ENV: production

  integracao:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Ambiente descartável
        run: npm run bootstrap

      - name: Postgres
        run: |
          docker compose -f infra/docker-compose.yml --project-directory . up -d postgres
          for tentativa in $(seq 1 40); do
            docker exec orla-postgres pg_isready -U postgres > /dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "postgres não ficou pronto" && exit 1

      - name: Migrações
        run: node scripts/migrate.mjs

      - name: App
        run: |
          npx next dev --port 3000 > app.log 2>&1 &
          for tentativa in $(seq 1 60); do
            curl -sf http://localhost:3000/api/health > /dev/null && exit 0
            sleep 2
          done
          cat app.log && exit 1

      - name: Testes de integração
        run: npm run test:integration

      - name: Log do app
        if: failure()
        run: tail -n 200 app.log
