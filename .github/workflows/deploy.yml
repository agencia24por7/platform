name: deploy

on:
  push:
    branches: [main]
    paths-ignore: ["infra/terraform/**", "**.md", "prototipo/**"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  qualidade:
    uses: ./.github/workflows/ci.yml

  publicar:
    needs: qualidade
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: producao

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Autenticar no Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Construir e publicar a imagem
        env:
          IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/orla/app
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Enviar configuração da pilha
        env:
          VM: tria-${{ vars.ENVIRONMENT }}-vm
          ZONE: ${{ vars.GCP_ZONE }}
        run: |
          tentar() {
            for n in 1 2 3 4 5; do
              "$@" && return 0
              echo "tentativa $n falhou; o tunel IAP cai de vez em quando. repetindo em 15s"
              sleep 15
            done
            return 1
          }
          mkdir -p /tmp/pilha && cp -a infra/compose/. /tmp/pilha/ && cp -a db/migrations /tmp/pilha/migrations
          tentar gcloud compute scp --recurse /tmp/pilha/* "$VM:/tmp/compose" \
            --zone "$ZONE" --tunnel-through-iap --quiet
          tentar gcloud compute ssh "$VM" --zone "$ZONE" --tunnel-through-iap --quiet \
            --command "sudo sh -c 'find /opt/tria -mindepth 1 -maxdepth 1 ! -name .env -exec rm -rf {} +' && sudo cp -a /tmp/compose/. /opt/tria/ && rm -rf /tmp/compose"

      - name: Migrar volumes de tria para orla (uma vez)
        env:
          VM: tria-${{ vars.ENVIRONMENT }}-vm
          ZONE: ${{ vars.GCP_ZONE }}
        run: |
          tentar() {
            for n in 1 2 3 4 5; do
              "$@" && return 0
              echo "tentativa $n falhou; o tunel IAP cai de vez em quando. repetindo em 15s"
              sleep 15
            done
            return 1
          }
          tentar gcloud compute ssh "$VM" --zone "$ZONE" --tunnel-through-iap --quiet --command "
            set -eu
            if sudo docker volume inspect tria_postgres-data > /dev/null 2>&1 \
               && ! sudo docker volume inspect orla_postgres-data > /dev/null 2>&1; then
              echo 'copiando volumes de tria para orla (corte unico, containers antigos param durante a copia)'
              sudo docker stop tria-proxy tria-app tria-n8n tria-postgres 2>/dev/null || true
              for vol in postgres-data n8n-data caddy-data caddy-config; do
                sudo docker volume create orla_\$vol > /dev/null
                sudo docker run --rm -v tria_\$vol:/de -v orla_\$vol:/para alpine sh -c 'cp -a /de/. /para/'
              done
              sudo docker rm tria-proxy tria-app tria-n8n tria-postgres 2>/dev/null || true
              echo 'volumes copiados; os volumes tria_* antigos ficam intactos, sem remocao automatica.'
            else
              echo 'ja migrado ou nao ha volume tria_postgres-data — pulando.'
            fi
          "

      - name: Aplicar migrações pendentes
        env:
          VM: tria-${{ vars.ENVIRONMENT }}-vm
          ZONE: ${{ vars.GCP_ZONE }}
          IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/orla/app
        run: |
          tentar() {
            for n in 1 2 3 4 5; do
              "$@" && return 0
              echo "tentativa $n falhou; o tunel IAP cai de vez em quando. repetindo em 15s"
              sleep 15
            done
            return 1
          }
          tentar gcloud compute ssh "$VM" --zone "$ZONE" --tunnel-through-iap --quiet --command "
            set -eu
            sudo env APP_IMAGE='$IMAGE:${{ github.sha }}' docker compose -f /opt/tria/docker-compose.prod.yml --project-directory /opt/tria up -d postgres
            until sudo docker exec orla-postgres pg_isready -U postgres -d tria > /dev/null 2>&1; do sleep 2; done
            sudo sh /opt/tria/migrar.sh
          "

      - name: Subir a nova versão
        env:
          VM: tria-${{ vars.ENVIRONMENT }}-vm
          ZONE: ${{ vars.GCP_ZONE }}
          IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/orla/app
        run: |
          tentar() {
            for n in 1 2 3 4 5; do
              "$@" && return 0
              echo "tentativa $n falhou; o tunel IAP cai de vez em quando. repetindo em 15s"
              sleep 15
            done
            return 1
          }
          tentar gcloud compute ssh "$VM" --zone "$ZONE" --tunnel-through-iap --quiet --command "
            set -euo pipefail
            cd /opt/tria
            sudo sed -i '/^APP_IMAGE=/d' .env
            echo 'APP_IMAGE=$IMAGE:${{ github.sha }}' | sudo tee -a .env > /dev/null
            sudo gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
            sudo docker compose -f docker-compose.prod.yml pull
            sudo docker compose -f docker-compose.prod.yml up -d --remove-orphans
            sudo docker compose -f docker-compose.prod.yml restart proxy
            sudo docker image prune -af --filter until=72h
          "

      - name: Conferir saúde
        env:
          HOST: ${{ vars.APP_HOSTNAME }}
        run: |
          for tentativa in $(seq 1 20); do
            if curl -sf "https://$HOST/api/health" > /dev/null; then
              echo "aplicação respondendo"
              exit 0
            fi
            sleep 10
          done
          echo "a aplicação não respondeu depois do deploy"
          exit 1
