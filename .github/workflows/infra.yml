name: infra

on:
  pull_request:
    paths: ["infra/terraform/**", ".github/workflows/infra.yml"]
  push:
    branches: [main]
    paths: ["infra/terraform/**", ".github/workflows/infra.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: infra
  cancel-in-progress: false

env:
  TF_VERSION: 1.13.1
  TF_IN_AUTOMATION: "true"
  WORKDIR: infra/terraform

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Autenticar com identidade somente leitura
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.TF_PLAN_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Formatação
        run: terraform -chdir=$WORKDIR fmt -check -recursive

      - name: Init
        run: terraform -chdir=$WORKDIR init -input=false -lock=false -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: Validate
        run: terraform -chdir=$WORKDIR validate

      - name: Plan
        run: terraform -chdir=$WORKDIR plan -input=false -lock=false -out=plano.tfplan
        env:
          TF_VAR_environment: ${{ vars.ENVIRONMENT }}
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_billing_account_id: ${{ secrets.GCP_BILLING_ACCOUNT }}
          TF_VAR_app_hostname: ${{ vars.APP_HOSTNAME }}
          TF_VAR_n8n_hostname: ${{ vars.N8N_HOSTNAME }}
          TF_VAR_dns_zone_name: ${{ vars.DNS_ZONE_NAME }}
          TF_VAR_dns_zone_project: ${{ vars.DNS_ZONE_PROJECT }}
          TF_VAR_acme_email: ${{ vars.ACME_EMAIL }}
          TF_VAR_budget_notification_emails: '["${{ vars.ACME_EMAIL }}"]'

      - name: Resumo do plano
        run: terraform -chdir=$WORKDIR show -no-color plano.tfplan | head -200 >> $GITHUB_STEP_SUMMARY

  apply:
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: producao
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.TF_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        run: terraform -chdir=$WORKDIR init -input=false -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: Apply
        run: terraform -chdir=$WORKDIR apply -input=false -auto-approve -lock-timeout=120s
        env:
          TF_VAR_environment: ${{ vars.ENVIRONMENT }}
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_billing_account_id: ${{ secrets.GCP_BILLING_ACCOUNT }}
          TF_VAR_app_hostname: ${{ vars.APP_HOSTNAME }}
          TF_VAR_n8n_hostname: ${{ vars.N8N_HOSTNAME }}
          TF_VAR_dns_zone_name: ${{ vars.DNS_ZONE_NAME }}
          TF_VAR_dns_zone_project: ${{ vars.DNS_ZONE_PROJECT }}
          TF_VAR_acme_email: ${{ vars.ACME_EMAIL }}
          TF_VAR_budget_notification_emails: '["${{ vars.ACME_EMAIL }}"]'
