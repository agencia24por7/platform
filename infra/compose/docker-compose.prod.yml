name: orla

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging: *logging

services:
  postgres:
    image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: orla-postgres
    <<: *hardening
    environment:
      POSTGRES_DB: tria
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?required}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?required}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?required}
    command:
      - postgres
      - -c
      - shared_buffers=48MB
      - -c
      - max_connections=30
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - effective_cache_size=256MB
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks: [interna]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tria"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    image: ${APP_IMAGE:?required}
    container_name: orla-app
    <<: *hardening
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=256
      DATABASE_URL: ${DATABASE_URL:?required}
      DATABASE_URL_WORKER: ${DATABASE_URL_WORKER:?required}
      TRIA_WORKER_TOKEN: ${TRIA_WORKER_TOKEN:?required}
      TRIA_APP_BASE_URL: ${TRIA_APP_BASE_URL:?required}
      BQ_PROJECT_ID: ${BQ_PROJECT_ID:-}
      BQ_DATASET: ${BQ_DATASET:-tria_dw}
      CONTEXT_BUCKET: ${CONTEXT_BUCKET:-}
      TOKENS_KMS_KEY: ${TOKENS_KMS_KEY:-}
      TRIA_SESSION_SECRET: ${TRIA_SESSION_SECRET:?required}
      LOG_LEVEL: info
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_EXCLUSAO_PEPPER: ${META_EXCLUSAO_PEPPER:-}
      META_LOGIN_CONFIG_ID: ${META_LOGIN_CONFIG_ID:-}
      RDSTATION_CLIENT_ID: ${RDSTATION_CLIENT_ID:-}
      RDSTATION_CLIENT_SECRET: ${RDSTATION_CLIENT_SECRET:-}
      WHATSAPP_LOGIN_CONFIG_ID: ${WHATSAPP_LOGIN_CONFIG_ID:-}
      LEADADS_LOGIN_CONFIG_ID: ${LEADADS_LOGIN_CONFIG_ID:-}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      N8N_API_URL: ${N8N_API_URL:-}
      N8N_API_KEY: ${N8N_API_KEY:-}
      N8N_PUBLIC_URL: ${N8N_PUBLIC_URL:-}
      N8N_OWNER_EMAIL: ${N8N_OWNER_EMAIL:-}
      N8N_OWNER_PASSWORD: ${N8N_OWNER_PASSWORD:-}
    networks: [interna]
    mem_limit: 320m
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop: [ALL]

  n8n:
    image: n8nio/n8n@sha256:8602f5dfacbe2c931eeafd010de0e68182310e9f309921e780ab69182e92b3ae
    container_name: orla-n8n
    <<: *hardening
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_OPTIONS: --max-old-space-size=640
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?required}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?required}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_PORT: 5678
      N8N_PROXY_HOPS: 1
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_RUNNERS_ENABLED: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: "all"
      EXECUTIONS_TIMEOUT_MAX: "86400"
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
    volumes:
      - n8n-data:/home/node/.n8n
    networks: [interna]
    mem_limit: 768m
    cap_drop: [ALL]

  proxy:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    container_name: orla-proxy
    <<: *hardening
    depends_on: [app, n8n]

    environment:
      APP_HOST: ${APP_HOST:?required}
      N8N_HOST: ${N8N_HOST:-}
      ACME_EMAIL: ${ACME_EMAIL:?required}
      PROXY_BASIC_AUTH: ${PROXY_BASIC_AUTH:?required}
    ports:
      - "80:80"
      - "443:443"
    command:
      - sh
      - -c
      - |
        mkdir -p /etc/caddy/conf.d && rm -f /etc/caddy/conf.d/*.caddy
        if [ -n "$${N8N_HOST}" ]; then cp /etc/caddy/n8n.caddy /etc/caddy/conf.d/n8n.caddy; fi
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./n8n.caddy:/etc/caddy/n8n.caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [interna]
    mem_limit: 64m
    cap_add: [NET_BIND_SERVICE]
    cap_drop: [ALL]

networks:
  interna:
    driver: bridge

volumes:
  postgres-data:
  n8n-data:
  caddy-data:
  caddy-config:
