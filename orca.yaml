scripts:
  setup: |
    set -eu
    [ -f .env ] || { [ -f "$ORCA_ROOT_PATH/.env" ] && cp "$ORCA_ROOT_PATH/.env" .env; } || true
    [ -d node_modules ] || npm ci --no-audit --no-fund
    git config --unset core.hooksPath || true
    node scripts/ambiente-verificar.mjs --rapido
  archive: |
    git status --short
